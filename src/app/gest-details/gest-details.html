<h2 mat-dialog-title>Confirmar Ingreso</h2>

<mat-dialog-content *ngIf="guest">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ guest.nombre }} {{ guest.apellido }}</mat-card-title>
      <mat-card-subtitle>{{ guest.tipoDocumento }}: {{ guest.numeroDocumento }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- <p><strong>ID:</strong> {{ guest.id }}</p> -->
      <p><strong>Ya ingreso:</strong> {{ guest.isIngress ? 'Sí' : 'No' }}</p>
      <p><strong>Código de Invitación:</strong> {{ guest.invitationCode }}</p>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>

<div align="end">
  <button class="button Cancel" (click)="cancelar()">Cancelar</button>
  <button class="button Ok" (click)="confirmar()">Marcar Ingreso</button>
</div>
